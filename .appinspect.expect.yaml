# Accepted (vetted) Splunk AppInspect failures for ucc_app_builder, consumed by
# splunk/appinspect-cli-action. Each comment MUST contain an ADDON-<n> / APPCERT-<n>
# reference (the action enforces this). This is an open-source hackathon entry with
# no Splunkbase certification ticket, so the IDs below are placeholders — the real
# rationale is in the text. Both accepted failures are inherent to vendoring the
# modern cp313 Splunk Agent SDK advisor stack and are false positives on the target
# runtime (Splunk Enterprise 10.4 = CPython 3.13, x86_64).
  check_aarch64_compatibility:
    comment: 'ADDON-0001: ships x86_64 cp313 wheels for the Splunk Agent SDK advisor stack (pydantic_core, cffi, jiter, …) which has no aarch64 build; the app targets x86_64 Splunk Enterprise.'
  check_all_python_files_are_well_formed:
    comment: "ADDON-0002: vendored cp313 libraries (langgraph, …) use Python 3.12/3.13 syntax that AppInspect's older static parser cannot read; the code is valid on Splunk 10.4 (CPython 3.13)."
  # --- TEMPORARY, remove once the build stops emitting appserver/templates/base.html ---
  # New in splunk-appinspect 4.3.0 (both FUTURE_FAILURE, not hard failures): custom Mako
  # templates are deprecated in Splunk Enterprise 10.4 and removed in a later version.
  # The offender is the generated appserver/templates/base.html, not hand-written code.
  # AppInspect's own remediation is to regenerate with UCC framework >= 6.3.0 or
  # @splunk/create >= 11.0.0, which is the real fix and is tracked separately — these
  # entries only stop the 4.3.0 dependency bump sitting red in the meantime.
  # Raised with Splunk by Will (2026-08-03) pending guidance.
  check_for_custom_mako_templates:
    comment: 'ADDON-0003: FUTURE_FAILURE only. Generated appserver/templates/base.html; deprecated in Splunk 10.4. Remediation is a ucc-gen >= 6.3.0 / @splunk/create >= 11.0.0 regeneration, tracked separately. Raised with Splunk 2026-08-03.'
  check_for_existence_of_python_code_block_in_mako_template:
    comment: 'ADDON-0004: FUTURE_FAILURE only. Same generated base.html as ADDON-0003. Not hand-written template code; no arbitrary Python of ours executes in CherryPy. Remove with ADDON-0003.'
