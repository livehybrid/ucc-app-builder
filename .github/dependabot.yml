version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # eslint-plugin-react-refresh 0.5.x drops ESLint 8 support (peer: eslint
      # ^9 || ^10). This project is pinned to eslint ^8.57.0, so 0.5.x breaks
      # `npm ci` with an ERESOLVE peer conflict. Hold at 0.4.x until we migrate
      # the toolchain to ESLint 9 (flat config + @typescript-eslint v8).
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (action `uses:` pins across all workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "ci"
      - "automated"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # Pinned Splunk dev toolchain for the deterministic loop-smoke gate
  # (.github/dev-requirements.txt). Bumps arrive as PRs that the loop-smoke job
  # validates (must still reach AppInspect-CLEAN) before they can be merged.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "ci"
      - "dependencies"
      - "automated"
