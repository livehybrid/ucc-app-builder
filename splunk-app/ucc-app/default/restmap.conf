# Native same-origin API handler for the embedded SPA. The page loader still rewrites
# /api/... to this single '/proxy' endpoint (path carried in the `p` param), but it is now
# served ENTIRELY in Splunk's python (ucc-gen + AppInspect build, artifact generators, LLM
# proxy, input emulator, Splunk metadata) — there is NO Node sidecar. (Was builder_proxy.)
[script:ucc_proxy]
match = /ucc_app_builder/proxy
script = builder_api.py
scripttype = persist
handler = builder_api.BuilderApiHandler
# 3.13: vendored ucc-framework + appinspect + solnlib stack use 3.10+ syntax that
# crashes on Splunk's 3.9. python.version satisfies check_rest_handler_python_executable_exists;
# python.required = 3.13 takes precedence at runtime.
python.version = python3
python.required = 3.13
passPayload = true
passSystemAuth = true
passHttpHeaders = true

# Self-registration endpoint, fired by app.conf [triggers] on tools.conf (re)load.
# On Splunk Enterprise it upserts this app's MCP tools into the Splunk MCP Server's
# KV; on Splunk Cloud it no-ops (the native synced-apps registrar handles it).
# Pure stdlib + splunk.rest, so it runs on Splunk's default 3.9 persistent python too.
[script:ucc_app_builder_autoregister]
match = /ucc_app_builder/autoregister
script = autoregister.py
scripttype = persist
handler = autoregister.AutoRegisterHandler
python.version = python3
python.required = 3.9,3.13
passPayload = true
passSystemAuth = true

# UCC Configuration page handler (AI Provider tab). The handler file
# ucc_app_builder_rh_settings.py is generated by ucc-gen into bin/; these stanzas are
# kept here because the custom restmap.conf above shadows ucc-gen's generated one.
# The [admin:<app>] stanza EXPOSES the admin_external handler in the EAI tree.
[admin:ucc_app_builder]
match = /
members = ucc_app_builder_settings

[admin_external:ucc_app_builder_settings]
handlertype = python
# Run on python 3.13 — the vendored solnlib / splunklib / urllib3 / requests /
# charset_normalizer stack is built for 3.13 and uses `X | Y` union syntax that
# TypeErrors on Splunk's default 3.9 persistent-handler python.
python.version = python3
python.required = 3.13
handlerfile = ucc_app_builder_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true
