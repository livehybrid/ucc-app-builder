# Per-session add-on project file storage (the VFS the AI authors into).
[ucc_builder_files]
field.session = string
field.path = string
field.content = string
field.updated_at = number

# Saved add-on projects ("My Apps") — one row per (user, appId), files as a JSON blob.
[ucc_builder_apps]
field.uid = string
field.appId = string
field.name = string
field.version = string
field.files = string
field.updated_at = number

# Durable Splunk Agent SDK (splunklib.ai) run traces — one row per chat run, full progress
# trace (assistant/tool_call/tool_result) as a JSON blob, so a run outlives the per-job
# file TTL and can be reviewed/debugged/fed to eval.
[ucc_agent_traces]
field.uid = string
field.job_id = string
field.created_at = number
field.model = string
field.provider = string
field.status = string
field.prompt = string
field.answer = string
field.error = string
field.step_count = number
field.event_count = number
field.events = string
